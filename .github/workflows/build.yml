name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select Build Type'
        required: true
        default: 'Debug'
        type: choice
        options:
        - Debug
        - Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug
      if: github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'Debug'
      run: ./gradlew assembleDebug

    - name: Build Release
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'Release'
      run: ./gradlew assembleRelease
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Upload Debug APK
      if: github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'Debug'
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Decode Keystore & Sign Release APK
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'Release'
      uses: r0adkll/sign-android-release@v1
      id: sign_app
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.KEYSTORE_B64 }}
        alias: ${{ secrets.KEY_ALIAS }}
        keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}
      env:
        BUILD_TOOLS_VERSION: "34.0.0"

    - name: Upload Release APK
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: ${{steps.sign_app.outputs.signedReleaseFile}}
